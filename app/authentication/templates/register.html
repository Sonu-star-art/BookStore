<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css">
        
    </head>
    <body>
        <div class="columns is-vcentered" style="height: 100vh;">
            <div class="column">
                <div class="box is-flex is-flex-direction-column" style="align-items: center; width: 30%; justify-self: center;">
                    <h2 class="title">Register</h2>
                    <form action="/register/submit-register" method="post" style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                        <input class="input" type="text" name="username" placeholder="Username" required>
                        <input class="input" type="password" name="password" placeholder="Password" required>
                        <input class="input" type="text" name="email" placeholder="Email" required> 
                        <div>
                            Are you an Admin?
                            <input class="checkbox" type="checkbox" name="is_admin" value="true">
                        </div>
                        <input class="button" type="submit" value="register">
                    </form>
                    
                    <a href="/login">Login</a>
                </div>

            </div>
        </div>
    </body>
</html>
